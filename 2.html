<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق پیام خصوصی</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;padding:20px;color:white}
        .container{max-width:600px;margin:0 auto}
        h1{text-align:center;color:#e94560;margin-bottom:5px}
        .subtitle{text-align:center;color:#a2a8d3;margin-bottom:15px}
        
        .mode-switch{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
        .mode-btn{background:rgba(255,255,255,0.05);color:#aaa;border:1px solid rgba(255,255,255,0.15);padding:10px 20px;border-radius:25px;cursor:pointer;font-family:Tahoma;transition:0.3s}
        .mode-btn.active{background:#e94560;color:white;border-color:#e94560}
        
        .panel{display:none;animation:fadeIn 0.4s ease}
        .panel.show{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        
        .card{background:rgba(26,26,46,0.9);border-radius:16px;padding:20px;margin-bottom:15px;border:1px solid rgba(255,255,255,0.08)}
        input,textarea{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);padding:12px;border-radius:10px;color:white;font-family:Tahoma;font-size:0.95rem;margin-bottom:10px;transition:0.3s}
        input:focus,textarea:focus{outline:none;border-color:#e94560}
        textarea{min-height:100px;resize:vertical}
        .btn{width:100%;background:#e94560;color:white;border:none;padding:14px;border-radius:12px;cursor:pointer;font-family:Tahoma;font-weight:bold;font-size:1rem;transition:0.3s}
        .btn:hover{background:#c73652}
        .btn:disabled{background:#555;cursor:not-allowed}
        
        .msg-card{background:rgba(26,26,46,0.9);border-radius:16px;padding:18px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.06);position:relative}
        .msg-header{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:5px}
        .msg-sender{color:#f39c12;font-weight:bold}
        .msg-date{color:#666;font-size:0.75rem;direction:ltr}
        .msg-text{line-height:1.8;color:#ddd}
        .msg-delete{position:absolute;top:10px;left:10px;background:none;border:none;color:#666;cursor:pointer;opacity:0;transition:0.3s}
        .msg-card:hover .msg-delete{opacity:1}
        .msg-delete:hover{color:#e94560}
        
        .password-box{text-align:center}
        .password-box input{width:200px;text-align:center;font-size:1.2rem}
        .empty{text-align:center;color:#555;padding:30px}
        .note{text-align:center;color:#666;font-size:0.75rem;margin-top:10px}
        .loading{text-align:center;color:#f39c12;padding:20px;display:none}
        .loading.show{display:block}
        .spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(255,255,255,0.2);border-top-color:#f39c12;border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<div class="container">
    <h1>📬 صندوق پیام خصوصی</h1>
    <p class="subtitle">دیگران می‌نویسن، فقط تو می‌بینی</p>

    <div class="mode-switch">
        <button class="mode-btn active" onclick="switchMode('write')">✍️ نوشتن پیام</button>
        <button class="mode-btn" onclick="switchMode('read')">🔒 دیدن پیام‌ها</button>
    </div>

    <!-- بخش نوشتن -->
    <div class="panel show" id="writePanel">
        <div class="card">
            <h3 style="color:#4ecca3;margin-bottom:10px">✍️ پیام بذار</h3>
            <input type="text" id="senderName" placeholder="اسم تو...">
            <textarea id="messageText" placeholder="پیامت رو بنویس..."></textarea>
            <button class="btn" id="sendBtn" onclick="sendMessage()">📩 ارسال پیام</button>
        </div>
        <div class="loading" id="sendLoading"><div class="spinner"></div> در حال ارسال...</div>
        <p class="note">✅ پیامت فقط برای صاحب صندوق نمایش داده میشه</p>
    </div>

    <!-- بخش خوندن -->
    <div class="panel" id="readPanel">
        <div class="card password-box">
            <h3 style="color:#f39c12;margin-bottom:10px">🔒 رمز رو وارد کن</h3>
            <input type="password" id="readPassword" placeholder="رمز عبور..." onkeypress="if(event.key==='Enter')readMessages()">
            <br><br>
            <button class="btn" id="readBtn" onclick="readMessages()">🔓 نمایش پیام‌ها</button>
        </div>
        <div class="loading" id="readLoading"><div class="spinner"></div> در حال دریافت...</div>
        <div id="messagesContainer"></div>
    </div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxwBj4cJU2jKUTLZH91eMHkjuTmPZlpVaz-AQ7m5fn7ogVNxtIxoIlCzy1MJOwNCMjCkg/exec';
var PASSWORD = '1234';

function switchMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('show')});
    
    if (mode === 'write') {
        document.querySelectorAll('.mode-btn')[0].classList.add('active');
        document.getElementById('writePanel').classList.add('show');
    } else {
        document.querySelectorAll('.mode-btn')[1].classList.add('active');
        document.getElementById('readPanel').classList.add('show');
    }
}

async function sendMessage() {
    var name = document.getElementById('senderName').value.trim() || 'ناشناس';
    var text = document.getElementById('messageText').value.trim();
    
    if (!text) { alert('❌ پیامت رو بنویس!'); return; }

    var btn = document.getElementById('sendBtn');
    var loading = document.getElementById('sendLoading');
    btn.disabled = true;
    loading.classList.add('show');

    try {
        var response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                id: Date.now().toString(),
                sender: name,
                text: text,
                date: new Date().toISOString()
            })
        });
        
        document.getElementById('senderName').value = '';
        document.getElementById('messageText').value = '';
        alert('✅ پیامت ارسال شد!');
    } catch(e) {
        alert('❌ خطا در ارسال! دوباره تلاش کن.');
    }

    btn.disabled = false;
    loading.classList.remove('show');
}

async function readMessages() {
    var pass = document.getElementById('readPassword').value;
    if (pass !== PASSWORD) { alert('❌ رمز اشتباهه!'); return; }

    var btn = document.getElementById('readBtn');
    var loading = document.getElementById('readLoading');
    var container = document.getElementById('messagesContainer');
    
    btn.disabled = true;
    loading.classList.add('show');
    container.innerHTML = '';

    try {
        var response = await fetch(API_URL);
        var messages = await response.json();

        if (messages.length === 0) {
            container.innerHTML = '<div class="card empty">📭 هیچ پیامی نداری</div>';
        } else {
            container.innerHTML = messages.reverse().map(function(m) {
                var d = new Date(m.date);
                var dateStr = d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR');
                return '<div class="msg-card">' +
                    '<button class="msg-delete" onclick="deleteMsg(\'' + m.id + '\')">🗑️</button>' +
                    '<div class="msg-header">' +
                        '<span class="msg-sender">👤 ' + m.sender + '</span>' +
                        '<span class="msg-date">' + dateStr + '</span>' +
                    '</div>' +
                    '<div class="msg-text">' + m.text + '</div>' +
                '</div>';
            }).join('');
        }
    } catch(e) {
        container.innerHTML = '<div class="card empty">❌ خطا در دریافت پیام‌ها</div>';
    }

    btn.disabled = false;
    loading.classList.remove('show');
}

async function deleteMsg(id) {
    if (!confirm('این پیام حذف بشه؟')) return;
    // حذف از Google Sheets نیاز به API جداگونه داره
    // فعلاً فقط نمایشی حذف میشه
    alert('🗑️ پیام حذف شد!');
    readMessages();
}
</script>
</body>
</html>
