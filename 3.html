<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت خصوصی | ورود با ایمیل</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:white}
        
        .chat-app{background:rgba(26,26,46,0.95);border-radius:24px;width:100%;max-width:500px;height:85vh;max-height:700px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1)}
        
        /* صفحه ورود */
        .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center}
        .login-screen h2{color:#e94560;margin-bottom:10px}
        .login-screen p{color:#a2a8d3;margin-bottom:25px;font-size:0.9rem}
        .login-screen input{width:100%;max-width:300px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);padding:14px;border-radius:12px;color:white;font-family:Tahoma;font-size:1rem;text-align:center;margin-bottom:15px}
        .login-screen input:focus{outline:none;border-color:#e94560}
        .login-btn{background:#e94560;color:white;border:none;padding:14px 40px;border-radius:12px;cursor:pointer;font-family:Tahoma;font-weight:bold;font-size:1rem;transition:0.3s}
        .login-btn:hover{background:#c73652}
        .login-note{color:#666;font-size:0.75rem;margin-top:15px}
        
        /* صفحه چت */
        .chat-screen{display:none;flex-direction:column;height:100%}
        .chat-screen.show{display:flex}
        .chat-header{background:#1a1a2e;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1)}
        .chat-header .user-info{display:flex;align-items:center;gap:10px}
        .chat-header .avatar{width:40px;height:40px;border-radius:50%;background:#e94560;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:bold}
        .chat-header .email{font-size:0.85rem;color:#a2a8d3}
        .logout-btn{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:Tahoma;font-size:0.8rem;transition:0.3s}
        .logout-btn:hover{background:rgba(233,69,96,0.3)}
        
        .messages-area{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
        .msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:0.9rem;line-height:1.5;position:relative;animation:msgIn 0.3s ease}
        @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .msg.sent{align-self:flex-end;background:#e94560;color:white;border-bottom-left-radius:4px}
        .msg.received{align-self:flex-start;background:#2a2a3e;color:white;border-bottom-right-radius:4px}
        .msg .sender{font-size:0.7rem;color:#f39c12;margin-bottom:3px;font-weight:bold}
        .msg .time{font-size:0.65rem;color:rgba(255,255,255,0.5);margin-top:4px;text-align:left;direction:ltr}
        
        .input-area{display:flex;gap:8px;padding:12px 15px;background:#1a1a2e;border-top:1px solid rgba(255,255,255,0.1)}
        .input-area input{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);padding:12px 15px;border-radius:25px;color:white;font-family:Tahoma;font-size:0.9rem}
        .input-area input:focus{outline:none;border-color:#e94560}
        .send-btn{background:#e94560;color:white;border:none;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:1.3rem;transition:0.3s;flex-shrink:0}
        .send-btn:hover{background:#c73652;transform:scale(1.05)}
        
        .loading{text-align:center;padding:20px;color:#f39c12;display:none}
        .loading.show{display:block}
        .spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,0.2);border-top-color:#f39c12;border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        .empty{text-align:center;color:#555;padding:40px}
    </style>
</head>
<body>

<div class="chat-app">
    <!-- صفحه ورود -->
    <div class="login-screen" id="loginScreen">
        <h2>💬 چت خصوصی</h2>
        <p>برای ورود، ایمیل خود را وارد کنید</p>
        <input type="email" id="emailInput" placeholder="example@mail.com" onkeypress="if(event.key==='Enter')login()">
        <button class="login-btn" onclick="login()">🚀 ورود به چت</button>
        <p class="login-note">🔒 ایمیل شما فقط برای شناسایی استفاده میشه</p>
    </div>

    <!-- صفحه چت -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">👤</div>
                <div>
                    <strong id="userName">کاربر</strong>
                    <div class="email" id="userEmail">email</div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 خروج</button>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="empty">💬 هنوز پیامی نیست... اولین نفر باش!</div>
        </div>

        <div class="loading" id="loading"><div class="spinner"></div> در حال بارگذاری...</div>

        <div class="input-area">
            <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter')sendChat()">
            <button class="send-btn" onclick="sendChat()">➤</button>
        </div>
    </div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxwBj4cJU2jKUTLZH91eMHkjuTmPZlpVaz-AQ7m5fn7ogVNxtIxoIlCzy1MJOwNCMjCkg/exec';
var currentUser = null; // { email, name, avatar }

// چک کردن کاربر ذخیره شده
var savedUser = localStorage.getItem('chatUser');
if (savedUser) {
    currentUser = JSON.parse(savedUser);
    showChat();
}

function login() {
    var email = document.getElementById('emailInput').value.trim().toLowerCase();
    if (!email || !email.includes('@')) {
        alert('❌ لطفاً یه ایمیل معتبر وارد کن!');
        return;
    }

    // ساخت پروفایل
    var name = email.split('@')[0];
    var avatars = ['😊','😎','🤩','😇','🥳','😍','🤓','🦊','🐱','🐼'];
    var avatar = avatars[Math.floor(Math.random() * avatars.length)];

    currentUser = {
        email: email,
        name: name,
        avatar: avatar
    };

    localStorage.setItem('chatUser', JSON.stringify(currentUser));
    showChat();
}

function logout() {
    if (confirm('از چت خارج میشی؟')) {
        localStorage.removeItem('chatUser');
        currentUser = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('chatScreen').classList.remove('show');
        document.getElementById('emailInput').value = '';
    }
}

function showChat() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('chatScreen').classList.add('show');
    
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userEmail').textContent = currentUser.email;
    document.getElementById('userAvatar').textContent = currentUser.avatar;
    
    loadMessages();
    document.getElementById('chatInput').focus();
}

async function sendChat() {
    var text = document.getElementById('chatInput').value.trim();
    if (!text) return;

    document.getElementById('chatInput').value = '';

    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                id: Date.now().toString(),
                sender: currentUser.email,
                name: currentUser.name,
                avatar: currentUser.avatar,
                text: text,
                date: new Date().toISOString()
            })
        });
        
        loadMessages();
    } catch(e) {
        alert('❌ خطا در ارسال!');
    }
}

async function loadMessages() {
    var loading = document.getElementById('loading');
    var area = document.getElementById('messagesArea');
    
    loading.classList.add('show');

    try {
        var response = await fetch(API_URL);
        var messages = await response.json();

        if (messages.length === 0) {
            area.innerHTML = '<div class="empty">💬 هنوز پیامی نیست... اولین نفر باش!</div>';
        } else {
            area.innerHTML = messages.map(function(m) {
                var isSent = m.sender === currentUser.email;
                var d = new Date(m.date);
                var time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
                
                return '<div class="msg ' + (isSent ? 'sent' : 'received') + '">' +
                    (!isSent ? '<div class="sender">' + (m.avatar||'👤') + ' ' + (m.name||m.sender) + '</div>' : '') +
                    '<div>' + m.text + '</div>' +
                    '<div class="time">' + time + '</div>' +
                '</div>';
            }).join('');
            
            area.scrollTop = area.scrollHeight;
        }
    } catch(e) {
        area.innerHTML = '<div class="empty">❌ خطا در دریافت پیام‌ها</div>';
    }

    loading.classList.remove('show');
}

// رفرش خودکار هر ۳ ثانیه
setInterval(function() {
    if (currentUser) loadMessages();
}, 3000);
</script>
</body>
</html>
